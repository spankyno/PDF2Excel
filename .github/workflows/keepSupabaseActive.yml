      - name: Ping Supabase (Heartbeat con tabla dedicada)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🚀 Iniciando Heartbeat a Supabase..."

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: Faltan secrets"
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # JSON adaptado a la nueva tabla keep_alive_heartbeat
          JSON_BODY='{"status": "alive"}'

          echo "📤 JSON que se envía: $JSON_BODY"
          echo "📍 Usando tabla: keep_alive_heartbeat"

          # INSERT a la nueva tabla
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            "$SUPABASE_URL/rest/v1/keep_alive_heartbeat" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$JSON_BODY")

          HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:[0-9]*//')

          echo "Código HTTP INSERT: $HTTP_CODE"
          echo "Respuesta: $BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ INSERT exitoso - Actividad registrada correctamente"
          else
            echo "❌ Falló el INSERT. Probando fallback..."
            curl -s "$SUPABASE_URL/rest/v1/keep_alive_heartbeat?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true
          fi
