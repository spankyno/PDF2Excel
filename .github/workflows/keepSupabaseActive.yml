- name: Ping Supabase (Heartbeat con INSERT)
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  run: |
    echo "🚀 Iniciando Heartbeat..."
    
    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    JSON_BODY="{\"status\": \"alive\", \"pinged_at\": \"$TIMESTAMP\"}"
    
    echo "📤 JSON que se envía: $JSON_BODY"

    # INSERT con respuesta completa en caso de error
    RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
      "$SUPABASE_URL/rest/v1/keep_alive" \
      -X POST \
      -H "apikey: $SUPABASE_ANON_KEY" \
      -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
      -H "Content-Type: application/json" \
      -H "Prefer: return=minimal" \
      -d "$JSON_BODY")

    HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
    BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:[0-9]*//')

    echo "Código HTTP: $HTTP_CODE"
    echo "Respuesta: $BODY"
