- name: Ping Supabase (heartbeat con INSERT)
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  run: |
    echo "🚀 Iniciando heartbeat..."

    # INSERT ligero (más confiable que solo SELECT)
    RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
      "$SUPABASE_URL/rest/v1/keep_alive" \
      -X POST \
      -H "apikey: $SUPABASE_ANON_KEY" \
      -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
      -H "Content-Type: application/json" \
      -H "Prefer: return=minimal" \
      -d '{"status": "alive", "pinged_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}')

    echo "Código HTTP INSERT: $RESPONSE"

    if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "200" ]; then
      echo "✅ INSERT exitoso"
    else
      echo "❌ Falló INSERT, intentando SELECT fallback..."
      # Tu código SELECT actual como backup
      curl -s -o response.txt -w "%{http_code}" \
        "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1" \
        -H "apikey: $SUPABASE_ANON_KEY" \
        -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true
    fi
	